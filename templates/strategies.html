{% extends "layout.html" %}

{% block content %}
<div class="page">
  <div class="page-head">
    <div>
      <div class="h1">Strategy Leaderboard</div>
      <div class="muted">Live journal when available; otherwise backtest or quick synthetic fallback — all strategies show from day one.</div>
    </div>
    <div class="row gap-8">
      <select id="windowSelect" onchange="loadLeaderboard()" style="padding:8px 14px; border-radius:8px; background:#2a2e39; border:1px solid #363a45; color:#d1d4dc; font-size:14px;">
        <option value="30">Last 30 days</option>
        <option value="90" selected>Last 90 days</option>
        <option value="180">Last 180 days</option>
      </select>
      <button class="btn" onclick="loadLeaderboard()">Refresh</button>
    </div>
  </div>

  <div class="card section">
    <div class="card-head">
      <div class="h2">Performance by Strategy</div>
      <div class="muted">Sorted by composite score · Source: <span class="tag" style="background:#14532d;color:#86efac">LIVE</span> · <span class="tag" style="background:#1e3a5f;color:#93c5fd">BACKTEST</span> · <span class="tag" style="background:#4c1d95;color:#e9d5ff">BLENDED</span></div>
    </div>
    <div id="leaderboardBody" style="padding:20px;"></div>
  </div>
</div>

<style>
  .sk-row { height: 16px; background: linear-gradient(90deg,#2a2e39,#363a45,#2a2e39); background-size:200% 100%; border-radius:6px; margin:10px 0; animation: sk 1.2s ease-in-out infinite; }
  @keyframes sk { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
</style>

<script>
  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s == null ? '' : String(s);
    return div.innerHTML;
  }
  function escapeAttr(s) {
    return String(s == null ? '' : s).replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  function sourceBadge(src) {
    const s = String(src || 'backtest').toLowerCase();
    if (s === 'live') return '<span class="tag" style="background:#14532d;color:#86efac;font-size:11px">LIVE</span>';
    if (s === 'blended') return '<span class="tag" style="background:#4c1d95;color:#e9d5ff;font-size:11px">BLENDED</span>';
    return '<span class="tag" style="background:#1e3a5f;color:#93c5fd;font-size:11px">BACKTEST</span>';
  }

  function skeletonTable() {
    let h = '<table class="tv-table" style="width:100%"><tbody>';
    for (let i = 0; i < 9; i++) {
      h += '<tr><td colspan="11"><div class="sk-row"></div></td></tr>';
    }
    h += '</tbody></table>';
    return h;
  }

  async function loadLeaderboard() {
    const el = document.getElementById('leaderboardBody');
    el.innerHTML = skeletonTable();
    const windowDays = parseInt(document.getElementById('windowSelect').value) || 90;
    try {
      const res = await fetch(`/api/strategies/leaderboard?window=${windowDays}`);
      const data = await res.json();
      if (!data.ok || !data.strategies) {
        el.innerHTML = '<div class="muted">Leaderboard unavailable.</div>';
        return;
      }
      const rows = data.strategies;
      if (rows.length === 0) {
        el.innerHTML = '<div class="muted">Empty leaderboard (unexpected).</div>';
        return;
      }
      let html = '<table class="tv-table"><thead><tr>';
      html += '<th>Strategy</th><th>Source</th><th class="right">Trades</th><th class="right">Win %</th><th class="right">PF</th>';
      html += '<th class="right">Sharpe</th><th class="right">Sortino</th><th class="right">Max DD</th><th class="right">Expect</th><th class="right">Hold h</th><th class="right">Score</th><th class="right">Action</th>';
      html += '</tr></thead><tbody>';
      rows.forEach(r => {
        const trades = Number(r.trades || 0);
        const strat = String(r.strategy || 'unknown');
        const enough = trades >= 10;
        const launchCell = enough
          ? `<button onclick="launchStrategyBot('${escapeAttr(strat)}')" style="font-size:11px; padding:3px 10px; background:#0f2f1a; color:#22c55e; border:1px solid rgba(34,197,94,0.45); border-radius:4px; cursor:pointer; font-weight:600;">Launch →</button>`
          : `<span class="muted" title="Need 10 live/backtest trades for launch CTA">—</span>`;
        const rf = r.regime_fit || {};
        const rfTip = `TREND_UP ${(rf.TREND_UP||0).toFixed(2)} · DOWN ${(rf.TREND_DOWN||0).toFixed(2)} · RANGE ${(rf.RANGE||0).toFixed(2)} · RISK_OFF ${(rf.RISK_OFF||0).toFixed(2)}`;
        html += `<tr title="${escapeAttr(rfTip)}">
          <td><strong>${escapeHtml(strat)}</strong></td>
          <td>${sourceBadge(r.source)}</td>
          <td class="right">${trades}</td>
          <td class="right">${Number(r.win_rate||0).toFixed(1)}</td>
          <td class="right">${Number(r.profit_factor||0).toFixed(2)}</td>
          <td class="right">${Number(r.sharpe||0).toFixed(2)}</td>
          <td class="right">${Number(r.sortino||0).toFixed(2)}</td>
          <td class="right">${Number(r.max_dd||0).toFixed(3)}</td>
          <td class="right">${Number(r.expectancy||0).toFixed(3)}</td>
          <td class="right">${Number(r.avg_hold_hours||0).toFixed(1)}</td>
          <td class="right"><span class="tag tag-pos">${Number(r.score||0).toFixed(0)}</span></td>
          <td class="right">${launchCell}</td>
        </tr>`;
      });
      html += '</tbody></table>';
      el.innerHTML = html;
    } catch (e) {
      el.innerHTML = '<div class="muted">Failed to load: ' + (e.message || String(e)) + '</div>';
    }
  }

  function launchStrategyBot(strategyName) {
    window.location.href = '/bots?openCreate=1&strategy=' + encodeURIComponent(strategyName) + '&mode=live';
  }
  loadLeaderboard();
</script>
{% endblock %}
